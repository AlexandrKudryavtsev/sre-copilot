name: sre-copilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sre_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-sre_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sre_copilot_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - monitoring_core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sre_copilot}
      DB_USERNAME: ${POSTGRES_USER:-sre_copilot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sre_copilot_dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MONITORING_COLLECTION_INTERVAL: ${MONITORING_COLLECTION_INTERVAL:-30s}
      MONITORING_REQUEST_TIMEOUT: ${MONITORING_REQUEST_TIMEOUT:-5s}
      MONITORING_MAX_RESPONSE_BYTES: ${MONITORING_MAX_RESPONSE_BYTES:-2097152}
      MONITORING_RECOVERY_CHECKS: ${MONITORING_RECOVERY_CHECKS:-3}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  monitoring_core_postgres_data:
