name: sre-copilot

services:
  frontend:
    build:
      context: ./front
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  demo-service:
    build:
      context: ./demo-service
    environment:
      DEMO_SCENARIO: ${DEMO_SCENARIO:-normal}
    ports:
      - "127.0.0.1:${DEMO_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sre_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-sre_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sre_copilot_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - monitoring_core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sre_copilot}
      DB_USERNAME: ${POSTGRES_USER:-sre_copilot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sre_copilot_dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MONITORING_COLLECTION_INTERVAL: ${MONITORING_COLLECTION_INTERVAL:-5s}
      MONITORING_SCHEDULER_ENABLED: ${MONITORING_SCHEDULER_ENABLED:-true}
      MONITORING_REQUEST_TIMEOUT: ${MONITORING_REQUEST_TIMEOUT:-5s}
      MONITORING_MAX_RESPONSE_BYTES: ${MONITORING_MAX_RESPONSE_BYTES:-2097152}
      MONITORING_RECOVERY_CHECKS: ${MONITORING_RECOVERY_CHECKS:-3}
      OPENAI_TOKEN: ${OPENAI_TOKEN:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2000}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-30s}
      AI_POLL_INTERVAL: ${AI_POLL_INTERVAL:-1s}
      AI_HISTORY_WINDOW: ${AI_HISTORY_WINDOW:-30m}
      AI_MAX_HISTORY_POINTS: ${AI_MAX_HISTORY_POINTS:-120}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-1048576}
      AI_SCHEDULER_ENABLED: ${AI_SCHEDULER_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  monitoring_core_postgres_data:
