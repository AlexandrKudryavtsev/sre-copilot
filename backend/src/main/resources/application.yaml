spring:
  application:
    name: sre-copilot-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sre_copilot}
    username: ${DB_USERNAME:sre_copilot}
    password: ${DB_PASSWORD:sre_copilot_dev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

monitoring:
  collection-interval: ${MONITORING_COLLECTION_INTERVAL:30s}
  request-timeout: ${MONITORING_REQUEST_TIMEOUT:5s}
  recovery-checks: ${MONITORING_RECOVERY_CHECKS:3}

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
